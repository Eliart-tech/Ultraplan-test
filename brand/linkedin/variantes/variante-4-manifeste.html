<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Variante 4 — Manifeste</title>
<!-- Variante de la bannière LinkedIn Maiven, 1584 × 396. ?zones=1 affiche la zone de la photo. -->
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="extra.css">
<link rel="stylesheet" href="palettes.css">
</head>
<body>
<div class="banner" id="banner">
  <div class="glow glow--sky"></div>
  <div class="glow glow--mid"></div>
  <div class="glow glow--blush"></div>
  <div class="dots"></div>
  <div class="grid-line" style="left: 520px"></div>
  <svg class="rings" width="1584" height="396" viewBox="0 0 1584 396" fill="none" aria-hidden="true">
    <g stroke="var(--ring)" stroke-width="1.2">
      <circle cx="200" cy="350" r="190"/><circle cx="200" cy="350" r="262"/>
      <circle cx="200" cy="350" r="340" stroke-dasharray="2 7"/><circle cx="200" cy="350" r="424"/>
    </g>
    <g fill="var(--blush-300)"><circle cx="310" cy="195" r="3.5"/><circle cx="420" cy="107" r="2.5" opacity=".7"/><circle cx="60" cy="96" r="2.5" opacity=".55"/></g>
    <g fill="var(--sky-500)"><circle cx="152" cy="98" r="3" opacity=".9"/><circle cx="470" cy="190" r="2.5" opacity=".6"/></g>
  </svg>
  <div class="copy v-manifest" style="top: 60px">
    <div class="brand">
      <span class="brand__mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 19V6.4c0-.62.75-.93 1.19-.49L12 12.7l6.81-6.79c.44-.44 1.19-.13 1.19.49V19" stroke="#253066" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span>Maiven</span><span class="brand__sep"></span><span class="brand__tag">Agence IA pour PME</span>
    </div>
    <h1>L’IA fait le travail,<br><span class="accent">vous décidez.</span></h1>
    <div class="foot" style="margin-top: 30px">
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg> maivenagency.com</span><i class="dot"></i>
      <span class="cta">Réservez un appel découverte <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span>
    </div>
  </div>
  <div class="keywords">
    <div>Agents IA <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg></div>
    <div>Automatisations <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg></div>
    <div>Audit &amp; conseil <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg></div>
    <div>Formation IA <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg></div>
  </div>
  <div class="zone zone--mobile"></div>
  <div class="zone"></div>
</div>
<script>
  if (new URLSearchParams(location.search).has("zones")) document.documentElement.dataset.zones = "";
  if (new URLSearchParams(location.search).get("palette")) document.documentElement.dataset.palette = new URLSearchParams(location.search).get("palette");
</script>
</body>
</html>
